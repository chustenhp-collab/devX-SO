<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devX OS</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Escritorio con cuadrícula organizada */
        #desktop {
            width: 100vw;
            height: calc(100vh - 48px);
            background: #0078d7 url('fondo.jpg') no-repeat center center / cover;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fill, 90px);
            grid-auto-rows: 95px;
            grid-auto-flow: column;
            padding: 15px;
            gap: 10px;
        }

        /* Iconos del Escritorio */
        .shortcut {
            width: 85px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .shortcut:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .shortcut .icon {
            font-size: 34px;
            margin-bottom: 6px;
        }

        .shortcut span {
            font-size: 11px;
            line-height: 1.2;
            padding: 0 4px;
            word-break: break-word;
        }

        /* Barra de Tareas */
        #taskbar {
            width: 100vw;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10000;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .taskbar-left, .taskbar-center, .taskbar-right {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .start-btn {
            height: 100%;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .system-clock {
            color: white;
            font-size: 11px;
            padding: 0 15px;
            text-align: right;
            line-height: 1.3;
        }

        /* Menú Inicio */
        #start-menu {
            position: fixed;
            bottom: 54px;
            left: 6px;
            width: 280px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
            color: white;
        }

        .start-header {
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .start-apps {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .start-app-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .start-app-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Ventanas */
        .window {
            position: absolute;
            width: 650px;
            height: 450px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .window-header {
            height: 36px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: move;
            border-bottom: 1px solid #ddd;
        }

        .window-title {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .btn-close { background: #ff5f56; }
        .btn-minimize { background: #ffbd2e; }
        .btn-maximize { background: #27c93f; }

        .window-body {
            flex: 1;
            padding: 12px;
            overflow: auto;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Aplicaciones Estilo */
        textarea.notepad-area {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Segoe UI', monospace;
            font-size: 13px;
            line-height: 1.4;
        }

        .browser-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .browser-bar input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .browser-bar button {
            padding: 6px 14px;
            background: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .browser-content {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            background: #fafafa;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            gap: 10px;
            font-size: 13px;
        }

        .file-item:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>

    <!-- Escritorio -->
    <div id="desktop">
        <div class="shortcut" onclick="openApp('files')">
            <span class="icon">📁</span>
            <span>Archivos</span>
        </div>
        <div class="shortcut" onclick="openApp('notepad')">
            <span class="icon">📝</span>
            <span>Bloc Notas</span>
        </div>
        <div class="shortcut" onclick="openApp('browser')">
            <span class="icon">🌐</span>
            <span>Navegador</span>
        </div>
        <div class="shortcut" onclick="openApp('incognito')">
            <span class="icon">🕵️</span>
            <span>Modo Privado</span>
        </div>
        <div class="shortcut" onclick="openApp('calc')">
            <span class="icon">🔢</span>
            <span>Calculadora</span>
        </div>
        <div class="shortcut" onclick="openApp('terminal')">
            <span class="icon">💻</span>
            <span>Terminal</span>
        </div>
    </div>

    <!-- Menú Inicio -->
    <div id="start-menu">
        <div class="start-header">devX OS</div>
        <div class="start-apps">
            <div class="start-app-item" onclick="openApp('files'); toggleStartMenu();">
                <span>📁</span> Explorador de Archivos
            </div>
            <div class="start-app-item" onclick="openApp('notepad'); toggleStartMenu();">
                <span>📝</span> Bloc de Notas
            </div>
            <div class="start-app-item" onclick="openApp('browser'); toggleStartMenu();">
                <span>🌐</span> Navegador Web
            </div>
            <div class="start-app-item" onclick="openApp('incognito'); toggleStartMenu();">
                <span>🕵️</span> Navegador Anónimo
            </div>
            <div class="start-app-item" onclick="openApp('calc'); toggleStartMenu();">
                <span>🔢</span> Calculadora
            </div>
            <div class="start-app-item" onclick="openApp('terminal'); toggleStartMenu();">
                <span>💻</span> devX Terminal
            </div>
        </div>
    </div>

    <!-- Barra de Tareas -->
    <div id="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="toggleStartMenu()">🪟</div>
        </div>
        <div class="taskbar-center" id="taskbar-apps"></div>
        <div class="taskbar-right">
            <div class="system-clock" id="clock">00:00<br>01/01/2026</div>
        </div>
    </div>

    <script>
        let zIndexCounter = 100;

        // Configuración de tu repositorio de GitHub para leer archivos automáticamente
        const GITHUB_USER = "chustenhp-collab";
        const GITHUB_REPO = "devX-SO";

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString();
            document.getElementById('clock').innerHTML = `${time}<br>${date}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function openApp(type) {
            const desktop = document.getElementById('desktop');
            const win = document.createElement('div');
            win.className = 'window';
            win.style.top = `${60 + Math.random() * 40}px`;
            win.style.left = `${80 + Math.random() * 60}px`;
            win.style.zIndex = ++zIndexCounter;

            let title = '';
            let content = '';

            switch (type) {
                case 'notepad':
                    title = 'Bloc de Notas';
                    content = `<textarea class="notepad-area" placeholder="Escribe tus notas aquí..."></textarea>`;
                    break;
                case 'browser':
                    title = 'Navegador Web';
                    content = `
                        <div class="browser-bar">
                            <input type="text" id="url-${zIndexCounter}" value="https://es.wikipedia.org" placeholder="URL">
                            <button onclick="navigate('${zIndexCounter}')">Ir</button>
                        </div>
                        <div class="browser-content" style="height: calc(100% - 40px);">
                            <iframe id="frame-${zIndexCounter}" src="https://es.wikipedia.org" style="width:100%; height:100%; border:none;"></iframe>
                        </div>
                    `;
                    break;
                case 'incognito':
                    title = '🕵️ Navegador Anónimo (Privado)';
                    content = `
                        <div style="background: #2b2b2b; color: #fff; padding: 6px; font-size: 11px; border-radius: 4px; margin-bottom: 6px;">
                            🔒 Sesión Privada: No guarda historial ni datos locales.
                        </div>
                        <div class="browser-bar">
                            <input type="text" id="url-${zIndexCounter}" value="https://lite.duckduckgo.com/lite/" placeholder="Buscar...">
                            <button onclick="navigate('${zIndexCounter}')" style="background:#444;">Ir</button>
                        </div>
                        <div class="browser-content" style="height: calc(100% - 75px);">
                            <iframe id="frame-${zIndexCounter}" src="https://lite.duckduckgo.com/lite/" style="width:100%; height:100%; border:none;"></iframe>
                        </div>
                    `;
                    break;
                case 'calc':
                    title = 'Calculadora';
                    content = `
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; height: 100%;">
                            <input type="text" id="calc-screen" style="grid-column: span 4; font-size: 22px; text-align: right; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" readonly>
                            <button onclick="calcInput('7')" style="font-size:16px; cursor:pointer;">7</button>
                            <button onclick="calcInput('8')" style="font-size:16px; cursor:pointer;">8</button>
                            <button onclick="calcInput('9')" style="font-size:16px; cursor:pointer;">9</button>
                            <button onclick="calcInput('/')" style="font-size:16px; cursor:pointer; background:#f0f0f0;">/</button>
                            <button onclick="calcInput('4')" style="font-size:16px; cursor:pointer;">4</button>
                            <button onclick="calcInput('5')" style="font-size:16px; cursor:pointer;">5</button>
                            <button onclick="calcInput('6')" style="font-size:16px; cursor:pointer;">6</button>
                            <button onclick="calcInput('*')" style="font-size:16px; cursor:pointer; background:#f0f0f0;">*</button>
                            <button onclick="calcInput('1')" style="font-size:16px; cursor:pointer;">1</button>
                            <button onclick="calcInput('2')" style="font-size:16px; cursor:pointer;">2</button>
                            <button onclick="calcInput('3')" style="font-size:16px; cursor:pointer;">3</button>
                            <button onclick="calcInput('-')" style="font-size:16px; cursor:pointer; background:#f0f0f0;">-</button>
                            <button onclick="calcClear()" style="font-size:16px; cursor:pointer; background:#ff5f56; color:white;">C</button>
                            <button onclick="calcInput('0')" style="font-size:16px; cursor:pointer;">0</button>
                            <button onclick="calcSolve()" style="font-size:16px; cursor:pointer; background:#27c93f; color:white;">=</button>
                            <button onclick="calcInput('+')" style="font-size:16px; cursor:pointer; background:#f0f0f0;">+</button>
                        </div>
                    `;
                    break;
                case 'files':
                    title = 'Explorador de Archivos (GitHub Sync)';
                    content = `
                        <div style="display:flex; gap:12px; height: 100%;">
                            <div style="width: 35%; border-right: 1px solid #ddd; padding-right: 8px; display:flex; flex-direction:column; gap:6px;">
                                <div style="padding: 6px; background: rgba(0,120,215,0.1); border-radius: 4px; cursor: pointer; font-weight:600;">📁 Repositorio</div>
                            </div>
                            <div style="flex:1; overflow-y:auto;" id="file-list-${zIndexCounter}">
                                <p style="font-size: 13px; color: #666; padding: 10px;">Cargando archivos desde GitHub...</p>
                            </div>
                        </div>
                    `;
                    fetchGitHubFiles(zIndexCounter);
                    break;
                case 'terminal':
                    title = 'devX Terminal';
                    content = `
                        <div style="background: #1e1e1e; color: #00ff00; font-family: monospace; height: 100%; padding: 12px; border-radius: 4px; overflow-y:auto;" id="term-body">
                            devX OS v1.3 [Kernel Web + GitHub Sync]<br>
                            Escribe "help" para ver los comandos disponibles.<br><br>
                            <div style="display:flex;"><span>devX>&nbsp;</span><input type="text" style="background:transparent; border:none; color:#00ff00; outline:none; font-family:monospace; flex:1;" onkeydown="handleTerminal(event, this)"></div>
                        </div>
                    `;
                    break;
            }

            win.innerHTML = `
                <div class="window-header" onmousedown="dragWindow(event, this.parentElement)">
                    <div class="window-title">${title}</div>
                    <div class="window-controls">
                        <button class="control-btn btn-minimize" onclick="this.parentElement.parentElement.parentElement.style.display='none'"></button>
                        <button class="control-btn btn-maximize" onclick="maximizeWin(this.parentElement.parentElement.parentElement)"></button>
                        <button class="control-btn btn-close" onclick="this.parentElement.parentElement.parentElement.remove()"></button>
                    </div>
                </div>
                <div class="window-body">${content}</div>
            `;

            win.onmousedown = () => win.style.zIndex = ++zIndexCounter;
            desktop.appendChild(win);
        }

        // Función que lee los archivos subidos al repositorio en GitHub de forma automática
        async function fetchGitHubFiles(id) {
            const container = document.getElementById(`file-list-${id}`);
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    let html = '<h3 style="font-size: 13px; margin-bottom: 8px; color: #333;">Archivos en la nube (GitHub):</h3>';
                    data.forEach(file => {
                        let icon = file.type === 'dir' ? '📁' : '📄';
                        html += `
                            <div class="file-item">
                                <span>${icon}</span>
                                <a href="${file.html_url}" target="_blank" style="text-decoration: none; color: #0078d7; flex: 1;">${file.name}</a>
                                <span style="font-size: 11px; color: #888;">${file.size ? (file.size + ' bytes') : ''}</span>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="color:red; font-size:12px;">No se pudieron cargar los archivos.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p style="color:red; font-size:12px;">Error de conexión con la API de GitHub.</p>';
            }
        }

        function navigate(id) {
            let url = document.getElementById(`url-${id}`).value;
            if (!url.startsWith('http')) url = 'https://' + url;
            document.getElementById(`frame-${id}`).src = url;
        }

        function dragWindow(e, win) {
            let posX = e.clientX - win.offsetLeft;
            let posY = e.clientY - win.offsetTop;

            function move(e) {
                win.style.left = `${e.clientX - posX}px`;
                win.style.top = `${e.clientY - posY}px`;
            }

            function stop() {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', stop);
            }

            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', stop);
        }

        function maximizeWin(win) {
            if (win.dataset.maximized === 'true') {
                win.style.width = '650px';
                win.style.height = '450px';
                win.style.top = '80px';
                win.style.left = '100px';
                win.dataset.maximized = 'false';
            } else {
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 48px)';
                win.style.top = '0';
                win.style.left = '0';
                win.dataset.maximized = 'true';
            }
        }

        function calcInput(val) { document.getElementById('calc-screen').value += val; }
        function calcClear() { document.getElementById('calc-screen').value = ''; }
        function calcSolve() {
            try { document.getElementById('calc-screen').value = eval(document.getElementById('calc-screen').value); }
            catch { document.getElementById('calc-screen').value = 'Error'; }
        }

        function handleTerminal(e, input) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                const body = document.getElementById('term-body');
                let res = '';
                if (cmd === 'help') res = 'Comandos: help, clear, ver, date, files';
                else if (cmd === 'ver') res = 'devX OS v1.3 Build 2026';
                else if (cmd === 'date') res = new Date().toLocaleString();
                else if (cmd === 'files') res = `Repositorio conectado: ${GITHUB_USER}/${GITHUB_REPO}`;
                else if (cmd === 'clear') {
                    body.innerHTML = `devX OS v1.3 [Kernel Web]<br>Escribe "help" para comandos.<br><br><div style="display:flex;"><span>devX>&nbsp;</span><input type="text" style="background:transparent; border:none; color:#00ff00; outline:none; font-family:monospace; flex:1;" onkeydown="handleTerminal(event, this)"></div>`;
                    return;
                } else res = `Comando no reconocido: ${cmd}`;

                body.innerHTML += `<br>${res}<br><br><div style="display:flex;"><span>devX>&nbsp;</span><input type="text" style="background:transparent; border:none; color:#00ff00; outline:none; font-family:monospace; flex:1;" onkeydown="handleTerminal(event, this)"></div>`;
                body.scrollTop = body.scrollHeight;
            }
        }
    </script>
</body>
</html>
